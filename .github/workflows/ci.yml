name: CI

# Filet permanent (AUTONOMY_PLAN V5). Tout tourne en NATIF (pas de Docker) et
# OFFLINE : les fakes (FakeAssetProvider, resolve_fake, FakeAdventureDecomposer)
# couvrent le rail sans clé API. Aucun secret requis.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mypy cliquet + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (MoviePy / golden probes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify (mypy ratchet + full pytest)
        run: bash scripts/verify.sh --no-front --heavy

  frontend:
    name: frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Lint advisory (cohérent avec le Makefile : `ruff ... || true`, hors `make verify`).
      # Le gate dur du front = le build (tsc -b + vite). Le lint informe sans bloquer.
      - run: npm run lint
        working-directory: frontend
        continue-on-error: true

  e2e:
    name: e2e (Playwright, front en mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps (served in mock mode)
        run: npm ci
        working-directory: frontend
      - name: Install e2e deps
        run: npm install
        working-directory: e2e
      - name: Install Playwright + chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E
        run: npm test
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
