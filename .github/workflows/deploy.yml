name: Deploy (Fly.io)

# Déploiement continu, séparé du gate qualité (ci.yml).
#   push sur dev                      -> déploie l'env DEV  (vcm-studio-dev)
#   tag v*  OU  déclenchement manuel  -> déploie l'env PROD (vcm-studio-prod)
#
# Modèle de branches : main = canonique (protégée) ; dev = développement (on push ici) ;
# une release = merge dev -> main puis tag v* (déploie prod).
#
# Secret requis (repo) : FLY_API_TOKEN  (org-scoped, couvre dev+prod).
#   fly tokens create org   →   gh secret set FLY_API_TOKEN --body '<token>'
#
# Gate qualité : ci.yml tourne en parallèle. Pour bloquer un merge vers main tant que la
# CI n'est pas verte, activer la protection de branche « require status checks: CI » sur main.

on:
  push:
    branches: ["dev"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy-dev:
    # uniquement sur push de branche (pas sur tag)
    if: startsWith(github.ref, 'refs/heads/')
    name: deploy dev
    runs-on: ubuntu-latest
    concurrency: { group: deploy-dev, cancel-in-progress: true }
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip si FLY_API_TOKEN absent
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN absent → déploiement sauté (pose le secret pour activer la CD, cf. docs/DEPLOY.md)."
      - uses: actions/checkout@v5
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only --config fly.dev.toml
        if: env.FLY_API_TOKEN != ''

  deploy-prod:
    # uniquement sur tag v* ou déclenchement manuel
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: deploy prod
    runs-on: ubuntu-latest
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip si FLY_API_TOKEN absent
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN absent → déploiement sauté (pose le secret pour activer la CD, cf. docs/DEPLOY.md)."
      - uses: actions/checkout@v5
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only --config fly.toml
        if: env.FLY_API_TOKEN != ''
