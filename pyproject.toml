[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["infra.*", "features.*"]
strict = true

[[tool.mypy.overrides]]
module = "app"
# Legacy app.py: tolerant during refactor, will be --strict at step 9
ignore_errors = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "replicate.*", "openai.*", "moviepy.*"]
ignore_missing_imports = true
