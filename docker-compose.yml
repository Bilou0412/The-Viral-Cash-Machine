services:
  vcm-studio:
    build: .
    image: vcm-studio:latest
    container_name: vcm-studio
    ports:
      - "8000:8000"          # studio = http://localhost:8000
    env_file:
      - .env                 # OPENAI_API_KEY + REPLICATE_API_TOKEN (vrai GPT + génération)
    volumes:
      # Persiste DB (/data/studio.db) + vidéos/assets (/data/studio_output) sur l'hôte
      - ./studio_data:/data
    restart: unless-stopped
